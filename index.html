<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>PONG</h1>
        <div class="scoreboard">
            <div class="score-section">
                <h2>Player</h2>
                <p id="playerScore">0</p>
            </div>
            <div class="score-section">
                <h2>Computer</h2>
                <p id="computerScore">0</p>
            </div>
        </div>
        
        <div class="game-board" id="gameBoard">
            <!-- Left Paddle (Player) -->
            <div class="paddle player-paddle" id="playerPaddle"></div>
            
            <!-- Right Paddle (Computer) -->
            <div class="paddle computer-paddle" id="computerPaddle"></div>
            
            <!-- Ball -->
            <div class="ball" id="ball"></div>
            
            <!-- Center Line -->
            <div class="center-line"></div>
        </div>
        
        <div class="controls">
            <p>Controls: <strong>Arrow Keys Up/Down</strong> or <strong>Mouse Movement</strong></p>
            <button id="startBtn" class="start-btn">Start Game</button>
            <button id="resetBtn" class="reset-btn">Reset Score</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
